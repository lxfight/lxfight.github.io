<!DOCTYPE html>
<html lang="zh-CN" data-palette="offwhite">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 纸色主题：改 data-palette 即可切换整站配色
       offwhite 米白 / cream 米黄 / sand 沙色 / mist 冷灰 / sage 鼠尾草
       blueprint 蓝图纸 / chalkboard 黑板 / ink 铅笔黑 -->
  <title>{{title}} - lxfight</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a href="#main" class="skip-link">跳到主要内容</a>

  <div class="pencil-cursor" id="pencilCursor" aria-hidden="true"></div>
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <div class="page-loader" id="pageLoader" role="status" aria-label="页面加载中">
    <div class="loader-mark">
      <span class="loader-box" aria-hidden="true"></span>
      <span class="loader-text">翻开这一页…</span>
    </div>
  </div>

  <header class="site-header">
    <div class="wrap nav-shell">
      <a href="../index.html" class="nav-logo">
        <span class="logo-mark" aria-hidden="true">✎</span>
        lxfight
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="../index.html">首页</a></li>
          <li><a href="../blog.html" aria-current="page">博客</a></li>
          <li><a href="../about.html">关于</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="page-content">
    <!-- 页头带：纸色底 + 横格线，像笔记的抬头 -->
    <header class="section section-plain ruled-band post-hero">
      <div class="wrap-narrow">
        <p class="mark" style="rotate:-1.2deg">✎ 笔记</p>
        <h1>{{title}}</h1>
        <p class="post-meta">{{meta}}</p>
{{tags}}
      </div>
    </header>

    <!-- 正文带：纸片底，与页头形成色阶 -->
    <div class="section section-paper post-main">
      <div class="wrap-narrow">
        <article class="post-body">
{{content}}
        </article>
{{postNav}}

        <footer class="post-footer reveal">
          <a href="../blog.html" class="back-link hatch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19.5 12 C14 12 9.5 12 5.5 12"/>
              <path d="M11.5 5.5 C9.5 7.5 7.5 10 5.5 12 C7.5 14 9.5 16.5 11.5 18.5"/>
            </svg>
            返回博客列表
          </a>
        </footer>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-grid">
        <div>
          <a href="../index.html" class="footer-brand">lxfight</a>
          <p class="footer-tagline">在代码与文字之间，寻找可以长期维护的平衡。</p>
        </div>
        <div>
          <h4>页面</h4>
          <ul class="footer-list">
            <li><a href="../index.html">首页</a></li>
            <li><a href="../blog.html">博客</a></li>
            <li><a href="../about.html">关于</a></li>
          </ul>
        </div>
        <div>
          <h4>联系</h4>
          <ul class="footer-list">
            <li><a href="https://github.com/lxfight" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            <li><a href="mailto:contact@lxfight.com">Email</a></li>
            <li><a href="../blog.html">技术文章</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-base">
        <span>© {{currentYear}} lxfight · 用心书写每一篇</span>
        <span>手绘于方格纸上 · Sketch Style</span>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" type="button" aria-label="回到页面顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19.5 C12 14 12 9.5 12 5.5"/>
      <path d="M5.5 11.5 C7.5 9.5 10 7.5 12 5.5 C14 7.5 16.5 9.5 18.5 11.5"/>
    </svg>
  </button>

  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 载入遮罩：短促淡出
      var loader = document.getElementById('pageLoader');

      function hideLoader() {
        loader.classList.add('hidden');
      }

      if (document.readyState === 'complete') {
        hideLoader();
      } else {
        window.addEventListener('load', hideLoader);
      }
      setTimeout(hideLoader, 1200);

      // 铅笔笔尖光标
      var cursor = document.getElementById('pencilCursor');
      var finePointer = window.matchMedia('(pointer: fine)').matches;

      if (cursor && finePointer && !reduceMotion) {
        var pointerX = window.innerWidth / 2;
        var pointerY = window.innerHeight / 2;
        var ticking = false;

        document.addEventListener('mousemove', function (event) {
          pointerX = event.clientX;
          pointerY = event.clientY;

          // 首次移动指针后才显示，避免空载时出现孤立的笔尖
          if (!cursor.classList.contains('is-live')) {
            cursor.classList.add('is-live');
          }

          if (ticking) return;
          ticking = true;

          requestAnimationFrame(function () {
            cursor.style.left = pointerX + 'px';
            cursor.style.top = pointerY + 'px';
            ticking = false;
          });
        }, { passive: true });

        document.querySelectorAll('a, button, .tag, .tech-tag, .project-item, .interests-list li')
          .forEach(function (el) {
            el.addEventListener('mouseenter', function () { cursor.classList.add('is-inking'); });
            el.addEventListener('mouseleave', function () { cursor.classList.remove('is-inking'); });
          });

        document.addEventListener('mousedown', function () { cursor.classList.add('is-pressing'); });
        document.addEventListener('mouseup', function () { cursor.classList.remove('is-pressing'); });
      }

      // 阅读进度
      var progress = document.getElementById('scrollProgress');
      var backToTop = document.getElementById('backToTop');

      function onScroll() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var ratio = docHeight > 0 ? scrollTop / docHeight : 0;
        progress.style.width = Math.min(100, Math.max(0, ratio * 100)) + '%';
        backToTop.classList.toggle('visible', scrollTop > 300);
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      backToTop.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

    })();
  </script>
</body>
</html>
