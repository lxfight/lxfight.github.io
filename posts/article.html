<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">文章加载中... - lxfight</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>
</head>
<body>
  <!-- Navigation -->
  <header id="header">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">lxfight</a>
      <nav>
        <ul>
          <li><a href="../index.html">首页</a></li>
          <li><a href="../about.html">关于</a></li>
          <li><a href="../blog.html">博客</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Article Content -->
  <main class="post-content">
    <header class="post-header" id="post-header">
      <p class="post-meta">加载中...</p>
    </header>
    <div class="post-body" id="post-body"></div>
    <footer class="post-footer">
      <a href="../blog.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回博客列表
      </a>
    </footer>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2024 lxfight · 用心书写每一篇</p>
  </footer>

  <!-- Back to Top -->
  <button class="back-to-top" id="backToTop">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <script>
    const header = document.getElementById('header');
    const backToTop = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY > 300;
      backToTop.classList.toggle('visible', scrolled);
      header.classList.toggle('scrolled', window.scrollY > 50);
    });

    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    async function loadArticle() {
      const articleId = new URLSearchParams(window.location.search).get('id') || 'first-post';

      try {
        const configRes = await fetch(`../articles/${articleId}/config.json`);
        if (!configRes.ok) throw new Error('文章配置加载失败');
        const config = await configRes.json();

        const contentRes = await fetch(`../articles/${articleId}/content.md`);
        if (!contentRes.ok) throw new Error('文章内容加载失败');
        const markdown = await contentRes.text();

        document.title = `${config.title} - lxfight`;
        document.getElementById('page-title').textContent = `${config.title} - lxfight`;

        document.getElementById('post-header').innerHTML = `
          <h1>${config.title}</h1>
          <p class="post-meta">${config.date}${config.category ? ' · ' + config.category : ''}</p>
          ${config.tags ? `<div class="post-tags">${config.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
        `;

        document.getElementById('post-body').innerHTML = marked.parse(markdown);
      } catch (error) {
        document.getElementById('post-header').innerHTML = '<h1>文章加载失败</h1>';
        document.getElementById('post-body').innerHTML = `<p style="color: var(--secondary)">${error.message}</p>`;
      }
    }

    loadArticle();
  </script>
</body>
</html>
